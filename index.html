<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        :root {
            --bg: #0a0a0b;
            --panel: #111113;
            --panel-2: #151517;
            --text: #e8e8ea;
            --muted: #8c8c93;
            --border: rgba(255,255,255,.08);
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(255,255,255,.07), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Hauptbereich */
        .page {
            width: min(100% - 32px, 1100px);
            margin: 0 auto;
            padding: 56px 0;
        }

        /* Dezente Kopfzeile */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 14px rgba(255,255,255,.45);
        }

        .label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .panel {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            box-shadow:
                0 24px 80px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.025);
        }

        /* Die drei Punkte oben */
        .bar {
            height: 44px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,.015);
        }

        .bar span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3a3e;
        }

        /* =========================================================
           NUR DIESEN BEREICH ÄNDERN

           Deinen kompletten Text einfach zwischen die beiden
           <script>-Zeilen kopieren.

           Keine <p>, <br> oder andere HTML-Tags nötig.
           Zeilenumbrüche und Leerzeichen bleiben automatisch erhalten.
           ========================================================= */
        .content {
            padding: 38px 42px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;

            font-family:
                "SFMono-Regular",
                "Cascadia Code",
                "Roboto Mono",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 13px;
            line-height: 1.72;
            letter-spacing: .01em;
            color: #d7d7db;
            tab-size: 4;
        }

        .content::selection {
            background: #ffffff;
            color: #000000;
        }

        /* Schöne, dezente Scrollbar */
        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #303035;
            border: 2px solid var(--bg);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #44444a;
        }


        /* ================================
           BILDERGALERIE
        ================================= */

        .gallery {
            padding: 0 42px 42px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0d0d0f;
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,.18);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .35s ease, opacity .35s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.035);
        }

        .gallery-empty {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            padding: 24px 0 4px;
        }

        /* Vollbild-Anzeige */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(0,0,0,.88);
            backdrop-filter: blur(14px);
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: min(94vw, 1500px);
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 30px 100px rgba(0,0,0,.55);
        }

        .lightbox-close {
            position: fixed;
            top: 18px;
            right: 22px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,.12);
        }

        @media (max-width: 700px) {
            .gallery {
                padding: 0 20px 26px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .lightbox {
                padding: 14px;
            }
        }

        /* Mobile */
        @media (max-width: 700px) {
            .page {
                width: min(100% - 18px, 1100px);
                padding: 24px 0;
            }

            .content {
                padding: 26px 20px;
                font-size: 12px;
                line-height: 1.65;
            }

            .top {
                margin-bottom: 10px;
            }

            .panel {
                border-radius: 14px;
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            .panel {
                animation: enter .45s ease-out both;
            }

            @keyframes enter {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="top">
            <div class="top-left">
                <span class="dot"></span>
                <span class="label">Document</span>
            </div>
        </div>

        <section class="panel">

            <div class="bar">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="content" id="content"></div>

            <div class="gallery" id="gallery">
                <div class="gallery-grid" id="galleryGrid"></div>
                <div class="gallery-empty" id="galleryEmpty" hidden></div>
            </div>

        </section>

    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">×</button>
        <img id="lightboxImage" alt="">
    </div>

        const source = document.getElementById("raw-text");
        const content = document.getElementById("content");

        // Deinen Text als reinen Text anzeigen.
        content.textContent = source.textContent.trim();


        /* =========================================================
           BILDER AUS /img

           Trage hier die echten Dateinamen deiner Bilder ein.
           Die Bilder müssen im Ordner "img" neben dieser HTML-Datei liegen.
           ========================================================= */

        const imageFiles = [
            "1.png",
            "2.png",
            "3.png",
            "4.png",
            "5.png",
            "6.png",
            "7.png",
            "8.png",
            "9.png",
            "10.png",
            "11.png",
            "12.png",
            "13.png",
            "14.png",
            "15.png",
            "16.png",
            "17.png",
            "18.png",
            "19.png",
            "20.png",
            "21.png",
            "22.png",
            "23.png",
            "24.png",
            "25.png",
            "26.png",
            "27.png",
            "28.png",
            "29.png",
            "30.png",
            "31.png",
            "32.png",
            "33.png",
            "34.png",
            "35.png",
            "36.png",
            "37.png",
            "38.png",
            "39.png",
            "40.png",
            "41.png"

        ];

        const galleryGrid = document.getElementById("galleryGrid");
        const galleryEmpty = document.getElementById("galleryEmpty");

        function loadImages() {
            const validFiles = imageFiles
                .map(name => String(name).trim())
                .filter(name => name && !name.includes("/") && !name.includes("\\"));

            validFiles.forEach((fileName) => {
                const url = "img/" + encodeURIComponent(fileName);

                const item = document.createElement("button");
                item.className = "gallery-item";
                item.type = "button";

                const image = document.createElement("img");
                image.src = url;
                image.alt = fileName;
                image.loading = "lazy";
                image.decoding = "async";

                image.addEventListener("error", () => {
                    item.remove();
                    if (!galleryGrid.children.length) {
                        galleryEmpty.hidden = false;
                        galleryEmpty.textContent = "Keine Bilder gefunden.";
                    }
                });

                item.appendChild(image);
                galleryGrid.appendChild(item);
                item.addEventListener("click", () => openLightbox(url));
            });

            if (!validFiles.length) {
                galleryEmpty.hidden = false;
                galleryEmpty.textContent = "Keine Bilder angegeben.";
            }
        }




        /* ================================
           LIGHTBOX
        ================================= */

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxClose = document.getElementById("lightboxClose");

        function openLightbox(url) {
            lightboxImage.src = url;
            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImage.src = "";
            document.body.style.overflow = "";
        }

        lightboxClose.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        loadImages();
    </script>

</body>
</html>
